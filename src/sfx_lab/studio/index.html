<!doctype html>
<html lang="en"><head><title>SFX Studio</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sfx-lab-token" content="__SFX_LAB_TOKEN__">
<link rel="stylesheet" href="/static/studio.css">
<script defer src="/static/vendor/wavesurfer.min.js"></script>
<script defer src="/static/vendor/table-core.min.js"></script>
<script defer src="/static/studio.js"></script>
</head><body>

<div class="app" id="app">
  <aside class="side" aria-label="Collections">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8h1M5 5v6M8 2.5v11M11 5.5v5M14 8h.01"/></svg></div>
      SFX Studio
    </div>
    <div class="project-controls">
      <label class="eyebrow" for="projectSelect">Project</label>
      <div class="select"><select id="projectSelect" aria-label="Active project"></select></div>
      <button class="btn sm ghost" id="newProjectBtn">+ New project</button>
    </div>
    <div class="side-scroll">
      <div><h4>Library</h4><div class="nav" id="navColl"></div></div>
      <div><h4>Batches</h4><div class="nav" id="navBatch"></div></div>
      <div><h4>Tags</h4><div class="tags" id="navTags"></div></div>
    </div>
    <div class="side-foot"><div class="nav"><button id="tasteSide"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.5S2.5 10.3 2.5 6.4A2.9 2.9 0 0 1 8 5a2.9 2.9 0 0 1 5.5 1.4C13.5 10.3 8 13.5 8 13.5z"/></svg><span class="lbl">Sound taste</span><span class="ct" id="tasteAge">—</span></button></div></div>
  </aside>

  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show sidebar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <div class="seg" role="tablist" id="views">
      <button data-view="library" class="on" role="tab"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg><span class="l">Library</span></button>
      <button data-view="map" role="tab"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4.5" cy="10.5" r="1.6"/><circle cx="10" cy="5" r="1.6"/><circle cx="12" cy="11" r="1.6"/><circle cx="6" cy="4.5" r="1"/></svg><span class="l">Map</span></button>
      <button data-view="compare" role="tab"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="5" height="10" rx="1.2"/><rect x="9" y="3" width="5" height="10" rx="1.2"/></svg><span class="l">Compare</span></button>
      <button data-view="cues" role="tab" id="cuesTab" hidden><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="3" width="12" height="7" rx="1.5"/><path d="M4 13h2M8 13h1.5M12 13h0"/></svg><span class="l">Cue sheet</span></button>
      <button data-view="insights" role="tab"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5 6 8.5l3 2.5 4.5-6"/></svg><span class="l">Insights</span></button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="q" type="search" placeholder="Search sounds, prompts, notes" aria-label="Search">
      <kbd>⌘K</kbd>
    </div>
    <button class="btn ghost hide-sm" id="updateBtn" hidden><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Update taste <span class="badge" id="updateCount">0</span></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
    <button class="btn primary" id="newBtn"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>New batch</button>
  </header>

  <div class="main" id="main">
    <section class="view" id="view"></section>
    <aside class="insp" id="insp" aria-label="Sound details"></aside>
  </div>

  <footer class="player" aria-label="Player">
    <div class="transport">
      <button class="icon-btn p-extra" id="prevBtn" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 3h1.6v10H4zM14 3.4v9.2L6.6 8z"/></svg></button>
      <button class="big-play" id="playBtn" aria-label="Play"></button>
      <button class="icon-btn p-extra" id="nextBtn" aria-label="Next"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M10.4 3H12v10h-1.6zM2 3.4v9.2L9.4 8z"/></svg></button>
    </div>
    <div class="now"><div class="p" id="nowP"></div><div class="d" id="nowD"></div></div>
    <div class="wavebox"><span class="t" id="tCur">0.00</span><div id="pwave"></div><span class="t r" id="tDur">0.00</span></div>
    <label class="switch level-match"><input type="checkbox" id="levelMatch" checked>Level match</label>
    <div class="p-extra" id="pStars"></div>
    <div class="transport p-extra">
      <button class="icon-btn" id="loopBtn" aria-label="Loop playback" title="Loop"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V6a2 2 0 0 1 2-2h8l-2-2M13 9v1a2 2 0 0 1-2 2H3l2 2"/></svg></button>
      <button class="icon-btn" id="keysBtn" aria-label="Keyboard shortcuts" title="Keyboard (?)"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.5" y="4" width="15" height="10" rx="2"/><path d="M4.5 7h.01M7.5 7h.01M10.5 7h.01M13.5 7h.01M5.5 11h7"/></svg></button>
      <button class="icon-btn" id="inspBtn" aria-label="Toggle details" title="Details (I)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 2.5v11"/></svg></button>
    </div>
  </footer>
</div>
<div id="overlay"></div>

</body></html>
